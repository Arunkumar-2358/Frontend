name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      API_URL: http://localhost:4000
      SESSION_SECRET: ci-session-secret-ci-session-secret-00
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contracts:
    # Fails when src/contracts drifts from the API's main branch.
    # Needs a read-only token for the API repo in the API_REPO_TOKEN secret.
    runs-on: ubuntu-latest
    if: ${{ vars.API_REPOSITORY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_REPOSITORY }}
          token: ${{ secrets.API_REPO_TOKEN }}
          path: _api
          sparse-checkout: contracts
      - run: API_CONTRACTS_DIR=_api/contracts node scripts/sync-contracts.mjs --check

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: recruit-crm-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
